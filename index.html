<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра «21» - Лабораторна робота</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }

        .player-section, .computer-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 120px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }

        .name-tag {
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .score-box {
            background-color: #00a2ff;
            color: white;
            padding: 5px 30px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .attempt-text {
            font-style: italic;
            margin-bottom: 10px;
        }

        .generate-btn {
            background-color: #00ff00;
            color: black;
            font-weight: bold;
            border: none;
            padding: 10px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .generate-btn:hover {
            background-color: #00cc00;
        }
        
        .generate-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .card {
            width: 100px;
            height: 140px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            position: relative;
        }

        .card.red {
            color: red;
        }

        .card.black {
            color: black;
        }

        .card-top-left {
            position: absolute;
            top: 5px;
            left: 5px;
            font-size: 1rem;
            line-height: 1;
        }

        .card-bottom-right {
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 1rem;
            line-height: 1;
            transform: rotate(180deg);
        }

        .card-center {
            font-size: 3rem;
        }

        @media (max-width: 480px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }
            .controls {
                order: -1;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <h1>Лабораторна робота № 9<br>Маніпулювання стилями CSS. Гра «21»</h1>

    <div class="game-container">
        <div class="player-section">
            <div class="name-tag" id="user-name">User</div>
            <div class="score-box" id="user-score">0</div>
            <div id="user-card-container">
                <div class="card" style="border: 1px dashed #ccc; box-shadow: none;"></div>
            </div>
        </div>

        <div class="controls">
            <div class="attempt-text" id="attempt-counter">Спроба 0 з 3</div>
            <button class="generate-btn" id="generate-btn" onclick="generateCards()">Generate</button>
        </div>
		
        <div class="computer-section">
            <div class="name-tag">Computer</div>
            <div class="score-box" id="comp-score">0</div>
            <div id="comp-card-container">
                <div class="card" style="border: 1px dashed #ccc; box-shadow: none;"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
